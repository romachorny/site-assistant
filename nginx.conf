user root;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    access_log /dev/stdout;
    error_log /dev/stderr;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # The whole repository is the web root here, so the files that describe the
        # environment are downloadable unless they are closed by hand. Nothing in this
        # repo is secret, but a demo page is not a place to hand out its own plumbing.
        location ~ ^/(\.base44|\.git)/ { return 404; }
        location ~ ^/(AGENTS\.md|README\.md|docker-compose\.base44\.yml|nginx\.conf|\.gitignore)$ { return 404; }

        # assistant.js and push.js change with the pages they serve: ask, do not assume.
        location ~ ^/(assistant|push)\.js$ {
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location / {
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            try_files $uri $uri/ =404;
        }
    }
}
